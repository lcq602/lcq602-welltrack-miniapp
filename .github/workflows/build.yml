name: Build & Package

# 触发: 推到 main、提 PR、打 v* 标签 (发 Release)、手动点 Run workflow
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  backend-test:
    name: 后端测试 (FastAPI + uv)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
      - name: 同步依赖
        working-directory: backend
        run: uv sync --locked
      - name: 运行测试
        working-directory: backend
        run: uv run pytest -q
      - name: 编译检查
        working-directory: backend
        run: uv run python -m compileall -q app

  miniprogram-check:
    name: 小程序代码检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: JS 语法检查
        run: |
          fail=0
          for f in $(find miniprogram -name "*.js"); do
            node --check "$f" || fail=1
          done
          exit $fail
      - name: JSON 格式检查
        run: |
          for f in $(find miniprogram -name "*.json"); do
            python3 -m json.tool "$f" > /dev/null
          done
          python3 -m json.tool project.config.json > /dev/null

  package:
    name: 打包发布物
    needs: [backend-test, miniprogram-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 生成压缩包
        run: bash scripts/package.sh dist
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: welltrack-release
          path: dist/*.zip
          retention-days: 30
      - name: 标签发布到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true

  android-apk:
    name: 安卓 APK 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: 生成 CI 临时签名并构建 APK
        env:
          WELLTRACK_KEYSTORE: ${{ runner.temp }}/welltrack.keystore
          WELLTRACK_KS_PASS: ci-temp-password
          ANDROID_SDK: ${{ env.ANDROID_HOME }}
        run: bash scripts/build-apk.sh dist/welltrack.apk
      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: welltrack-apk
          path: dist/welltrack.apk
          retention-days: 30
