[project]
name = "welltrack-miniapp"
version = "0.1.0"
description = "Personal health tracking API for a WeChat mini program"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "python-dotenv>=1.2.4",
  "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
